    <meta property="og:image" content="/og-image-share-v2.jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Runtime config (Supabase / MySQL) -->
    <script src="/config.js"></script>

    <!-- Upgrade relative og:image & og:url ke absolute URL agar crawlers bisa membaca -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var imgSelectors = [
            'meta[property="og:image"]',
            'meta[property="og:image:secure_url"]',
            'meta[name="twitter:image"]',
            'meta[name="twitter:image:src"]'
          ];
          imgSelectors.forEach(function(sel) {
            var el = document.querySelector(sel);
            if (el) {
              var c = el.getAttribute('content') || '';
              if (c && c.startsWith('/') && !c.startsWith('//')) {
                el.setAttribute('content', origin + c);
              }
            }
          });
          ['meta[property="og:url"]', 'meta[name="twitter:url"]', 'meta[property="og:image:url"]'].forEach(function(sel) {
            var el = document.querySelector(sel);
            if (el) {
              var c = el.getAttribute('content') || '';
              if (c === '/' || (c.startsWith('/') && !c.startsWith('//'))) {
                el.setAttribute('content', origin + (c === '/' ? '' : c));
              }
            }
          });
          var canon = document.querySelector('link[rel="canonical"]');
          if (canon) {
            var h = canon.getAttribute('href') || '';
            if (h === '/' || (h.startsWith('/') && !h.startsWith('//'))) {
              canon.setAttribute('href', origin + (h === '/' ? '' : h));
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
